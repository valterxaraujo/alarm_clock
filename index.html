<!DOCUMENT html>
  <html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alarm Clock</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.cdnfonts.com/css/alarm-clock" rel="stylesheet">
                
  </head>
  <body id="container">
    <div id='alarm-container'>
      <div id="clockface">
        <div>
        <p id="dateText" class="clockText"><span id="weekDayText" class="clockText"></span>,<span id="monthText" class="clockText"></span><span id="dayOfMonthText" class="clockText"></span> <span id="yearText" class="clockText"></span></p>
        </div>
        <div id="timeText">
          <p id="time"class="clockText">00:00:00</p>
          <p id="am_pmText" class="modeText clockText">AM</p>
          <p id="textMode24h" class=" modeText clockText hide">24</p>
        </div>
      </div>
      <div id="buttonContainer">
         <button id="modeBtn" class="btn">MODE</button>
         <button id="addAlarmBtn" class="btn">ALARM</button>
         <button class="btn">SNOOZE</button>
         <button class="btn">STOP</button>
      </div>
    </div>
    <dialog id="addAlarmModal">
      <h2>SET NEW ALARM</h2>
        <form id=inputContainer>
          <label>TITLE:</label>
          <input id="newAlarmTitle"type="text" placeholder="ALARM 1">
          <label>DATE:</label>
          <input id="newAlarmDate"type="date" value="2025-06-08">
          <label>TIME:</label>
          <input id="newAlarmTime"type="time" value="09:00">
        </form>    
      <div id="repeatDaysContainer">
        <span id="sunday" class="alarmDays" data-day="sunday">S</span>
        <span id="monday" class="alarmDays">M</span>
        <span id="tuesday" class="alarmDays">T</span>
        <span id="wednesday" class="alarmDays">W</span>
        <span id="thursday" class="alarmDays">T</span>
        <span id="friday" class="alarmDays">F</span>
        <span id="saturday" class="alarmDays">S</span>
      </div>
      <button id="cancelBtn"class="modalBtn btn">CANCEL</button>
      <button id="saveBtn"class="modalBtn btn">SAVE</button>
    </dialog>
    <div id="alarmListContainer" ></div>
    <script src="script.js"></script>
  </body>
</html>
